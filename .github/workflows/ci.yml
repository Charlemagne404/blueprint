name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Blueprint
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Check tracked files for secrets
        run: npm run check:secrets

      - name: Check patch whitespace
        run: git diff --check

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate production configuration shape
        run: npm run check:production-config
        env:
          NODE_ENV: production
          BASE_URL: https://blueprint.example.test
          AUTH_API_BASE_URL: https://auth.example.test
          AUTH_LOGIN_POPUP_URL: https://blueprint.example.test/auth-popup/popup.html
          AUTH_TRUSTED_LOGIN_ORIGINS: https://blueprint.example.test
          AI_SERVER_BASE_URL: https://ai.example.test
          DISCORD_TOKEN: ci-placeholder-token
          DISCORD_CLIENT_ID: "123456789012345678"
          DISCORD_SESSION_SECRET: ci-placeholder-session-secret-at-least-32-chars
          VANGUARD_BACKEND_API_KEY: ci-placeholder-vanguard-key
          METRICS_TOKEN: ci-placeholder-metrics-token-at-least-32-chars
